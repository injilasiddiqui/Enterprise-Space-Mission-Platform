apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: enterprise-space

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: enterprise-space-mission-platform-frontend:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 5173